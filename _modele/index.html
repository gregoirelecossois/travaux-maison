<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="robots" content="noindex, nofollow">
<title>Modèle de travail</title>
<!-- MODÈLE D'UNE PAGE DE TRAVAIL — à copier dans un nouveau dossier (sciences-eau-1/, …),
     jamais à distribuer tel quel. Le dossier _modele/ n'est pas publié : GitHub Pages
     (Jekyll) ignore les dossiers qui commencent par « _ ».

     Une page de travail n'écrit que son CONTENU : commun/jeux.js fait le reste
     (élève, carte des missions, leçons, jeux, étoiles, envoi au professeur, mode
     professeur). Les types de jeux et le format des visuels sont décrits en tête de
     commun/jeux.js. Exemples complets : pc-peripheriques/, lumiere-1/, nerveux-1/.

     À reporter dans catalogue.js : le MÊME devoir, une étape par mission, dans l'ordre. -->
<link rel="stylesheet" href="../commun/maison.css">
<link rel="stylesheet" href="../commun/jeux.css">
</head>
<body>
<main class="ecran" id="ecran"></main>

<script src="../config.js"></script>
<script src="../commun/maison.js"></script>
<script src="../commun/jeux.js"></script>
<script>
'use strict';

Jeux.lancer({
  devoir: 'modele',          /* ⚠ le même id que dans catalogue.js, jamais renommé */
  titre: 'Modèle de travail',
  ic: '📘',
  duree: '10 min',
  missions: [
    { nom: 'Échauffement', ic: '🔥', accroche: 'Une phrase pour donner envie.',
      lecon: [
        { titre: 'Ce qu’il faut retenir', visuel: { ic: '💡' }, texte: 'Une ou deux phrases **courtes**.' }
      ],
      jeux: [
        { type: 'qcm', q: 'Combien font 2 + 2 ?', choix: ['4', '3', '5'], bon: 0, explication: '2 + 2 = 4.' },
        { type: 'vf', q: 'Le ciel est vert par beau temps.', vrai: false, explication: 'Il est bleu.' }
      ] },
    { nom: 'Le défi', ic: '🏆',
      jeux: [
        { type: 'tri', consigne: 'Dans quelle case ?',
          bacs: [{ nom: 'Animal', ic: '🐾' }, { nom: 'Objet', ic: '📦', couleur: '#ffd166' }],
          cartes: [{ txt: 'Un chat', ic: '🐱', bac: 0 }, { txt: 'Une chaise', ic: '🪑', bac: 1, pourquoi: 'On ne la nourrit pas !' }] }
      ] }
  ]
});
</script>
</body>
</html>
